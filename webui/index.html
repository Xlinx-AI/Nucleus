<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Universal Iterative AI Hub — WebUI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle fill='%230a79df' cx='16' cy='16' r='16'/><text x='16' y='21' font-size='15' text-anchor='middle' fill='white'>AI</text></svg>">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <svg width="36" height="36" viewBox="0 0 32 32"><circle fill="#0a79df" cx="16" cy="16" r="16"/><text x="16" y="23" font-size="18" text-anchor="middle" fill="white" font-family="Segoe UI, Arial">AI</text></svg>
        <span>Universal Iterative AI Hub</span>
      </div>
    </header>
    <main>
      <div id="chat-history" class="chat-history"></div>
      <div id="status" class="status"></div>
      <form id="chat-form" class="input-row" autocomplete="off">
        <input type="text" id="user-query" placeholder="Введите ваш запрос..." autocomplete="off" autofocus>
        <button id="send-btn" type="submit" aria-label="Отправить">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="12" fill="#0a79df"/>
            <path d="M8 12l5-5v3h5v4h-5v3l-5-5z" fill="#fff"/>
          </svg>
        </button>
      </form>
    </main>
  </div>
  <script src="main.js"></script>
</body>
</html>
